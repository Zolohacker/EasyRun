<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">EasyRun · 智能代跑平台</title>
  <desc id="desc">靛蓝色路线形 R 标志、深蓝背景与半透明卡片，与 EasyRun 工作台保持一致。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17233c"/>
      <stop offset="1" stop-color="#303b5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b7c4ff"/>
      <stop offset=".5" stop-color="#7785d8"/>
      <stop offset="1" stop-color="#4c59a6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#c1cdff" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9dafff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#9dafff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <ellipse cx="1020" cy="70" rx="410" ry="300" fill="url(#glow)"/>
  <g fill="url(#glass)" stroke="#dae2ff" stroke-opacity=".16">
    <rect x="857" y="-34" width="290" height="158" rx="24" transform="rotate(14 1002 45)"/>
    <rect x="910" y="158" width="262" height="180" rx="24" transform="rotate(-12 1041 248)"/>
  </g>
  <path d="M894 60h104a30 30 0 0 1 0 60h-40a30 30 0 0 0 0 60h108" fill="none" stroke="#c3ceff" stroke-opacity=".21" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1066" cy="180" r="6" fill="#c3ceff" fill-opacity=".45"/>
  <g transform="translate(78 80)">
    <rect width="160" height="160" rx="40" fill="#111b30" fill-opacity=".2" transform="translate(0 8)"/>
    <rect width="160" height="160" rx="40" fill="url(#accent)" stroke="#dce4ff" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="5" y="5" width="150" height="150" rx="36" fill="none" stroke="#fff" stroke-opacity=".16"/>
    <g transform="translate(20 20) scale(3.75)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 25V9a3 3 0 0 1 3-3h9a5 5 0 0 1 0 10H8m8 0 8 9"/>
      <circle cx="8" cy="25" r="1.7" fill="#fff" stroke="none"/>
    </g>
  </g>
  <text x="286" y="153" fill="#f6f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">EasyRun</text>
  <text x="291" y="202" fill="#d3dcf4" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="24" letter-spacing="3">智能代跑平台</text>
  <path d="M292 229h46" stroke="#a9b8ff" stroke-width="3" stroke-linecap="round"/>
  <text x="352" y="235" fill="#b8c5e2" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" letter-spacing="1">独立部署 · 一站式管理</text>
</svg>
