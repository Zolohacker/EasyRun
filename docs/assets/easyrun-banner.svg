  <circle cx="90" cy="360" r="210" fill="#1d81a8" opacity=".12" filter="url(#blur)"/>
  <g opacity=".16" stroke="#7cf5c5" fill="none">
    <path d="M0 74H1200M0 144H1200M0 214H1200M0 284H1200"/>
    <path d="M110 0V360M250 0V360M390 0V360M530 0V360M670 0V360M810 0V360M950 0V360M1090 0V360"/>
