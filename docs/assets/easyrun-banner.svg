      <stop offset="1" stop-color="#35e8a4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
