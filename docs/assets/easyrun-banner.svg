<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EasyRun</title>
  <desc id="desc">EasyRun 智能跑步任务与路线编排平台</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041713"/>
      <stop offset="0.52" stop-color="#082a22"/>
      <stop offset="1" stop-color="#071d2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e6a0"/>
      <stop offset="1" stop-color="#34c8ff"/>
